<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚾ オレンジ リンク集｜小山少年野球団 オレンジ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<!--
  ============================================================
  オレンジ リンク集（ver001）
  ・公開場所：orange リポジトリの直下に index.html として置く
    （いまの index.html＝父母向けマニュアルは manual.html にリネームする）
  ・リンクの中身は「スプレッドシートの links シート」から取ってくる。
    → カテゴリを増やしたいときも、シートに行を足すだけでこのHTMLは直さなくてよい。
  ・2回目からは前回の内容をすぐ表示し、うしろで最新を取り直す（待たされない）。
  ・幹事用のリンクはHTMLに一切書かない。パスワードが合ったときだけGASが返す。

  ★ さわるのはここだけ ★
    GAS_URL … スプレッドシートにつながっているGASのURL（末尾 /exec）
    TEXTS   … 画面に出る文言
  ============================================================
-->
<style>
/* ===== 色（あとから一括で変えられるように変数に集約。マニュアルと同じ） ===== */
:root{
  --orange:#f06a1e; --orange-dark:#d4530a; --orange-soft:#fff4ec; --orange-line:#ffe3ce;
  --green:#1f9d63;  --green-soft:#eef8f1;  --green-line:#cdecdb;
  --blue:#2f7cc4;   --blue-soft:#eff5fc;   --blue-line:#cfe2f6;
  --red:#c94a4a;    --red-soft:#fff1f1;    --red-line:#f5cccc;
  --warn:#8a5a00;   --warn-soft:#fff8e6;   --warn-line:#ffdf9e;
  --text:#333333; --sub:#6b6b6b; --line:#f0d9c8; --bg:#fffdfa; --card:#ffffff;
  --radius:20px; --round:'M PLUS Rounded 1c',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--round),"Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,sans-serif;
  background:var(--bg); color:var(--text); font-size:16px; line-height:1.85; font-weight:500;}
.wrap{max-width:640px; margin:0 auto; padding:0 16px 44px;}
section{margin-top:28px;}
p{margin-bottom:10px; text-wrap:pretty;}
.note{font-size:.86rem; color:var(--sub);}
b,strong{font-weight:800;}

/* ヘッダー */
header{position:relative; background:var(--orange); color:#fff; text-align:center;
  padding:28px 20px 32px; border-radius:0 0 28px 28px; overflow:hidden;}
header .ball{position:absolute; top:-18px; right:-10px; font-size:88px; opacity:.16;}
header .team{display:inline-block; font-size:.8rem; font-weight:700; letter-spacing:.08em;
  background:rgba(255,255,255,.22); padding:5px 14px; border-radius:999px;}
header h1{font-family:var(--round); font-weight:800; font-size:1.6rem; margin-top:10px; line-height:1.3;}
header .lead{font-size:.9rem; margin-top:6px; opacity:.96;}

/* 見出し */
.h2{display:flex; align-items:center; gap:10px; margin:0 0 10px;}
.h2 .emoji{font-size:1.4rem; line-height:1;}
.h2 h2{font-family:var(--round); font-weight:800; font-size:1.16rem; color:var(--orange);}
.cat-title{font-family:var(--round); font-weight:800; font-size:1rem; color:var(--orange);
  padding-bottom:6px; border-bottom:3px solid var(--orange-line); margin:18px 0 10px;}

/* リンクカード */
.lcard{display:flex; align-items:center; gap:12px; background:var(--card);
  border:2px solid var(--orange-line); border-radius:16px; box-shadow:0 3px 0 var(--orange-line);
  padding:13px 14px; margin-bottom:10px; min-height:72px; text-decoration:none; color:var(--text);}
.lcard:active{transform:translateY(1px);}
.lc-body{flex:1; min-width:0;}
.lc-title{display:block; font-family:var(--round); font-weight:800; font-size:1.02rem;
  line-height:1.45; color:var(--orange); word-break:break-word;}
.lc-desc{display:block; font-size:.84rem; color:var(--sub); line-height:1.6; margin-top:1px;}
.lc-go{flex:none; font-size:1.4rem; color:var(--orange); font-weight:800;}
.lc-author{display:inline-block; font-size:.74rem; color:var(--sub); margin-top:2px;}
/* 「みんなの追加」は色を変えて区別 */
.user-block .lcard{border-color:var(--green-line); box-shadow:0 3px 0 var(--green-line);}
.user-block .lc-title,.user-block .lc-go{color:var(--green);}

/* 自分が追加した行に出る小さな操作ボタン */
.row-ops{display:flex; gap:8px; margin:-4px 0 12px; padding-left:2px;}
.row-ops button{font-size:.76rem; font-weight:800; padding:7px 13px; border-radius:999px;
  border:2px solid var(--line); background:#fff; color:var(--sub); cursor:pointer;}
.row-ops .b-edit{border-color:var(--green-line); color:var(--green);}
.row-ops .b-hide{border-color:var(--red-line); color:var(--red);}

/* ボタン */
.btn{display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
  min-height:52px; padding:0 16px; background:var(--orange); color:#fff; font-family:var(--round);
  font-weight:800; font-size:1rem; border:none; border-radius:16px; box-shadow:0 3px 0 var(--orange-dark);
  text-decoration:none; cursor:pointer;}
.btn:active{transform:translateY(1px); box-shadow:0 2px 0 var(--orange-dark);}
.btn.ghost{background:#fff; color:var(--orange); border:2px solid var(--orange-line); box-shadow:0 3px 0 var(--orange-line);}
.btn.sub{background:#f4f2f0; color:var(--sub); box-shadow:0 3px 0 #ddd8d3;}

/* カード・状態表示 */
.card{background:var(--orange-soft); border-radius:var(--radius); padding:16px;}
.empty{background:#faf7f4; border-radius:14px; padding:16px; text-align:center; color:var(--sub); font-size:.9rem;}
.loading{text-align:center; color:var(--sub); font-size:.9rem; padding:18px;}

/* モーダル（追加・編集・幹事ログイン・パスワード変更で使い回す） */
.ov{position:fixed; inset:0; background:rgba(0,0,0,.45); display:none;
  align-items:flex-start; justify-content:center; padding:20px 14px; z-index:100; overflow-y:auto;}
.ov.open{display:flex;}
.modal{background:#fff; border-radius:20px; padding:18px; width:100%; max-width:460px; margin:auto 0;}
.modal h3{font-family:var(--round); font-weight:800; font-size:1.1rem; color:var(--orange); margin-bottom:10px;}
.modal label{display:block; font-size:.84rem; font-weight:800; color:var(--sub); margin:10px 0 4px;}
.modal input{width:100%; font-size:16px; font-family:inherit; padding:11px 12px;
  border:2px solid var(--line); border-radius:12px; background:#fffdfa;}
.modal .row-btn{display:flex; gap:10px; margin-top:16px;}
.modal .row-btn .btn{flex:1;}
.msg{font-size:.86rem; font-weight:700; margin-top:10px; padding:9px 11px; border-radius:10px; display:none;}
.msg.show{display:block;}
.msg.err{background:var(--red-soft); color:var(--red);}
.msg.ok{background:var(--green-soft); color:var(--green);}

/* 幹事ページ */
#organizerView{display:none;}
.org-warn{background:var(--warn-soft); border:2px solid var(--warn-line); border-radius:16px;
  padding:14px; margin-bottom:12px; font-size:.9rem; color:var(--warn); line-height:1.75;}
.sys-block .lcard{border-color:var(--warn-line); box-shadow:0 3px 0 var(--warn-line); background:#fffdf7;}
.sys-block .lc-title,.sys-block .lc-go{color:var(--warn);}
.sys-block .cat-title{color:var(--warn); border-bottom-color:var(--warn-line);}
.recent{background:var(--green-soft); border:2px solid var(--green-line); border-radius:16px; padding:14px; margin-bottom:14px;}
.recent .cat-title{margin-top:0; color:var(--green); border-bottom-color:var(--green-line);}
.recent .r-item{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px dashed var(--green-line);}
.recent .r-item:last-child{border-bottom:none;}
.recent .r-body{flex:1; min-width:0;}
.recent .r-title{font-weight:800; font-size:.94rem; word-break:break-word;}
.recent .r-sub{font-size:.76rem; color:var(--sub); word-break:break-all;}
.recent button{flex:none; font-size:.76rem; font-weight:800; padding:7px 11px; border-radius:999px;
  border:2px solid var(--red-line); background:#fff; color:var(--red); cursor:pointer;}

footer{text-align:center; font-size:.8rem; color:var(--sub); padding:18px 16px 34px;}
</style>
</head>
<body>

<header>
  <div class="ball">⚾</div>
  <div class="team">小山少年野球団 オレンジ</div>
  <h1>⚾ オレンジ リンク集</h1>
  <div class="lead">チームで使うページを、ここにまとめました 🌱</div>
</header>

<div class="wrap">

  <!-- ===== 公開ページ ===== -->
  <div id="publicView">
    <section id="teamSec">
      <div class="h2"><span class="emoji">📚</span><h2>チーム共通</h2></div>
      <div id="teamList"><div class="loading">読み込み中…</div></div>
    </section>

    <section id="userSec">
      <div class="h2"><span class="emoji">✨</span><h2>みんなの追加</h2></div>
      <div id="userList" class="user-block"></div>
      <button class="btn ghost" id="btnAdd" style="margin-top:12px;">＋ リンクを追加</button>
      <p class="note" style="margin-top:8px;">みんなで使えるリンクを自由に足せます（自分が足したものは、あとから直せます）。</p>
    </section>

    <section id="orgSec">
      <button class="btn sub" id="btnOrganizer">🔑 幹事用</button>
    </section>
  </div>

  <!-- ===== 幹事ページ（ログインできて初めて中身が入る。HTMLには何も書かない） ===== -->
  <div id="organizerView">
    <section>
      <div class="h2"><span class="emoji">🔑</span><h2>幹事メニュー</h2></div>
      <div id="recentBox"></div>
      <div id="orgList"></div>
      <button class="btn ghost" id="btnChangePw" style="margin-top:14px;">🔒 パスワードを変更</button>
      <button class="btn sub" id="btnBackPublic" style="margin-top:10px;">← リンク集にもどる</button>
    </section>
  </div>

</div>

<footer>小山少年野球団 オレンジ 父母会</footer>

<!-- ===== モーダル：リンクの追加・編集 ===== -->
<div class="ov" id="ovLink">
  <div class="modal">
    <h3 id="lkTitle">リンクを追加</h3>
    <label for="fTitle">タイトル（必須・50文字まで）</label>
    <input id="fTitle" type="text" maxlength="50" placeholder="例：〇〇球場の地図">
    <label for="fUrl">URL（必須・https:// から始まるもの）</label>
    <input id="fUrl" type="url" inputmode="url" placeholder="https://">
    <label for="fNote">ひとこと（任意・100文字まで）</label>
    <input id="fNote" type="text" maxlength="100" placeholder="例：駐車場は北側です">
    <label for="fAuthor">追加した人（任意・20文字まで）</label>
    <input id="fAuthor" type="text" maxlength="20" placeholder="例：和泉">
    <div class="msg" id="lkMsg"></div>
    <div class="row-btn">
      <button class="btn sub" data-close>とじる</button>
      <button class="btn" id="btnSaveLink">保存する</button>
    </div>
  </div>
</div>

<!-- ===== モーダル：幹事ログイン ===== -->
<div class="ov" id="ovAuth">
  <div class="modal">
    <h3>🔑 幹事用パスワード</h3>
    <label for="fPw">パスワード</label>
    <input id="fPw" type="password" autocomplete="current-password" placeholder="パスワードを入力">
    <div class="msg" id="authMsg"></div>
    <div class="row-btn">
      <button class="btn sub" data-close>とじる</button>
      <button class="btn" id="btnLogin">ひらく</button>
    </div>
  </div>
</div>

<!-- ===== モーダル：パスワード変更 ===== -->
<div class="ov" id="ovPw">
  <div class="modal">
    <h3>🔒 パスワードを変更</h3>
    <label for="fPwNow">いまのパスワード</label>
    <input id="fPwNow" type="password" autocomplete="current-password">
    <label for="fPwNew">新しいパスワード（英数字6文字以上）</label>
    <input id="fPwNew" type="password" autocomplete="new-password">
    <label for="fPwNew2">新しいパスワード（もう一度）</label>
    <input id="fPwNew2" type="password" autocomplete="new-password">
    <div class="msg" id="pwMsg"></div>
    <div class="row-btn">
      <button class="btn sub" data-close>とじる</button>
      <button class="btn" id="btnSavePw">変更する</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   ★ 設定（さわるのはここだけ） ★
   ============================================================ */
const GAS_URL = "https://script.google.com/macros/s/AKfycbxGKwfIE-zp_1FUdBZrDb_ZQ3Fl12dmjDevVNfOEBRuPOTAl2vFtcullzjjXtONFi_Dqg/exec";

const TEXTS = {
  emptyUser   : "まだありません。下のボタンから追加できます 🌱",
  emptyTeam   : "リンクがまだ登録されていません。",
  offline     : "最新の情報を取れませんでした（前回の内容を表示しています）",
  addedOk     : "追加しました 🎉",
  savedOk     : "なおしました ✓",
  hiddenOk    : "非表示にしました",
  confirmHide : "このリンクを消しますか？（あとで幹事が戻せます）",
  sysWarn     : "壊れても直せます。週1回の自動バックアップがあります。ただし、触る前に幹事役割まとめの該当ページを読んでください。"
};

/* 保存キー */
const K_CACHE  = "orangeLinksCache";   // リンク一覧のひかえ（すぐ表示するため）
const K_MINE   = "orangeMyLinkIds";    // 自分が追加した行のid
const K_CLIENT = "orangeClientId";     // 端末の目印（連投ふせぎ用）

/* ============================================================
   共通の道具
   ============================================================ */
function $(id){ return document.getElementById(id); }
/* 文字はすべて textContent で入れる＝タグが書かれても文字として表示される */
function el(tag, cls, text){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text != null) e.textContent = text;
  return e;
}
function lsGet(k, def){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; }catch(e){ return def; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function clientId(){
  let c = lsGet(K_CLIENT, null);
  if(!c){ c = "c" + Date.now() + Math.random().toString(36).slice(2,8); lsSet(K_CLIENT, c); }
  return c;
}
/* GASへの送信（text/plain で送る＝プリフライトで弾かれないため） */
async function api(payload){
  const res = await fetch(GAS_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  });
  return await res.json();
}
function showMsg(id, text, ok){
  const m = $(id);
  m.textContent = text;
  m.className = "msg show " + (ok ? "ok" : "err");
}
function hideMsg(id){ $(id).className = "msg"; }
function openOv(id){ $(id).classList.add("open"); }
function closeOv(id){ $(id).classList.remove("open"); }
document.querySelectorAll("[data-close]").forEach(function(b){
  b.onclick = function(){ b.closest(".ov").classList.remove("open"); };
});
/* 背景をタップしても閉じる */
document.querySelectorAll(".ov").forEach(function(o){
  o.onclick = function(ev){ if(ev.target === o) o.classList.remove("open"); };
});
/* 表示してよいURLか（https:// だけ通す。javascript: などは弾く） */
function safeUrl(u){
  const s = String(u == null ? "" : u).trim();
  return s.indexOf("https://") === 0 ? s : "";
}

/* ============================================================
   リンクの描画（カテゴリはデータから作る＝シートに足すだけで増える）
   ============================================================ */
let DATA = { team:[], user:[] };
let TOKEN = "";   // 幹事のログイン中だけ入る（sessionStorage）

function makeCard(r, colorClass){
  const url = safeUrl(r.url);
  const a = el("a", "lcard" + (colorClass ? " " + colorClass : ""));
  if(url){ a.href = url; a.target = "_blank"; a.rel = "noopener"; }
  const body = el("span", "lc-body");
  body.appendChild(el("span", "lc-title", r.title || ""));
  if(r.note) body.appendChild(el("span", "lc-desc", r.note));
  if(r.author) body.appendChild(el("span", "lc-author", "＋ " + r.author));
  a.appendChild(body);
  a.appendChild(el("span", "lc-go", "›"));
  return a;
}
/* カテゴリごとに区切って描く。カテゴリの順は sort の小さい行がある順 */
function renderByCategory(box, rows, colorClass){
  box.textContent = "";
  if(!rows.length){ box.appendChild(el("div","empty",TEXTS.emptyTeam)); return; }
  const cats = [];
  rows.forEach(function(r){
    const name = r.category || "その他";
    let c = cats.filter(function(x){ return x.name === name; })[0];
    if(!c){ c = { name:name, min:r.sort, rows:[] }; cats.push(c); }
    if(r.sort < c.min) c.min = r.sort;
    c.rows.push(r);
  });
  cats.sort(function(a,b){ return a.min - b.min; });
  cats.forEach(function(c){
    box.appendChild(el("div","cat-title", c.name));
    c.rows.sort(function(a,b){ return a.sort - b.sort; })
      .forEach(function(r){ box.appendChild(makeCard(r, colorClass)); });
  });
}
/* 「みんなの追加」＝カテゴリ分けなし。自分が足した行にだけ操作ボタンを出す */
function renderUser(){
  const box = $("userList");
  box.textContent = "";
  if(!DATA.user.length){ box.appendChild(el("div","empty",TEXTS.emptyUser)); return; }
  const mine = lsGet(K_MINE, []);
  DATA.user.slice().sort(function(a,b){ return a.sort - b.sort; }).forEach(function(r){
    box.appendChild(makeCard(r));
    /* 自分が追加した行だけ、直す／消すを出す（ロックされた行には出さない） */
    if(!r.locked && mine.indexOf(r.id) >= 0){
      const ops = el("div","row-ops");
      const be = el("button","b-edit","✏️ なおす");
      be.onclick = function(){ openEdit(r); };
      const bh = el("button","b-hide","🗑 けす");
      bh.onclick = function(){ hideLink(r); };
      ops.appendChild(be); ops.appendChild(bh);
      box.appendChild(ops);
    }
  });
}
function renderAll(){
  renderByCategory($("teamList"), DATA.team);
  renderUser();
}

/* ============================================================
   読み込み：まずひかえを出す → うしろで最新を取り直す
   ============================================================ */
function loadLinks(){
  const cached = lsGet(K_CACHE, null);
  if(cached && (cached.team || cached.user)){
    DATA = { team: cached.team || [], user: cached.user || [] };
    renderAll();                                   // ← 待たずにすぐ出る
  }
  api({ action:"getLinks" }).then(function(res){
    if(!res || !res.ok) return;
    const fresh = { team: res.team || [], user: res.user || [] };
    if(JSON.stringify(fresh) !== JSON.stringify(DATA)){   // 中身が変わったときだけ描き直す
      DATA = fresh;
      renderAll();
    }
    lsSet(K_CACHE, fresh);
  }).catch(function(){
    if(!cached) $("teamList").textContent = TEXTS.offline;
  });
}
/* 保存後は必ずサーバーから取り直す（ひかえも上書きする） */
function refresh(){
  return api({ action:"getLinks" }).then(function(res){
    if(!res || !res.ok) return;
    DATA = { team: res.team || [], user: res.user || [] };
    lsSet(K_CACHE, DATA);
    renderAll();
  });
}

/* ============================================================
   追加・編集・非表示
   ============================================================ */
let editingId = null;
$("btnAdd").onclick = function(){
  editingId = null;
  $("lkTitle").textContent = "リンクを追加";
  ["fTitle","fNote","fAuthor"].forEach(function(id){ $(id).value = ""; });
  $("fUrl").value = "https://";
  hideMsg("lkMsg");
  openOv("ovLink");
};
function openEdit(r){
  editingId = r.id;
  $("lkTitle").textContent = "リンクをなおす";
  $("fTitle").value = r.title || "";
  $("fUrl").value = r.url || "";
  $("fNote").value = r.note || "";
  $("fAuthor").value = r.author || "";
  hideMsg("lkMsg");
  openOv("ovLink");
}
$("btnSaveLink").onclick = async function(){
  const title = $("fTitle").value.trim();
  const url = $("fUrl").value.trim();
  if(!title){ showMsg("lkMsg","タイトルを入れてください"); return; }
  if(url.indexOf("https://") !== 0){ showMsg("lkMsg","URLは https:// から始まるものを入れてください"); return; }
  const btn = this; btn.disabled = true; btn.textContent = "保存中…";
  try{
    const res = await api({
      action: editingId ? "updateLink" : "addLink",
      id: editingId, title: title, url: url,
      note: $("fNote").value.trim(), author: $("fAuthor").value.trim(),
      clientId: clientId()
    });
    if(!res.ok){ showMsg("lkMsg", res.error || "保存できませんでした"); return; }
    if(!editingId && res.id){                       // 自分が足した行として覚えておく
      const mine = lsGet(K_MINE, []); mine.push(res.id); lsSet(K_MINE, mine);
    }
    showMsg("lkMsg", editingId ? TEXTS.savedOk : TEXTS.addedOk, true);
    setTimeout(function(){ closeOv("ovLink"); refresh(); }, 700);
  }catch(e){
    showMsg("lkMsg","送信できませんでした。通信を確認してください");
  }finally{
    btn.disabled = false; btn.textContent = "保存する";
  }
};
async function hideLink(r){
  if(!confirm(TEXTS.confirmHide)) return;
  try{
    const res = await api({ action:"hideLink", id:r.id });
    if(!res.ok){ alert(res.error || "できませんでした"); return; }
    refresh();
  }catch(e){ alert("通信できませんでした"); }
}

/* ============================================================
   幹事用（ログインできて初めてリンクが届く）
   ============================================================ */
$("btnOrganizer").onclick = function(){
  $("fPw").value = ""; hideMsg("authMsg"); openOv("ovAuth");
  setTimeout(function(){ $("fPw").focus(); }, 100);
};
$("fPw").addEventListener("keydown", function(e){ if(e.key === "Enter") $("btnLogin").click(); });

$("btnLogin").onclick = async function(){
  const pw = $("fPw").value;
  if(!pw){ showMsg("authMsg","パスワードを入れてください"); return; }
  const btn = this; btn.disabled = true; btn.textContent = "確認中…";
  try{
    const res = await api({ action:"auth", password: pw });
    if(!res.ok){ showMsg("authMsg", res.error || "ひらけませんでした"); return; }
    TOKEN = res.token;
    try{ sessionStorage.setItem("orangeOrgToken", TOKEN); }catch(e){}
    closeOv("ovAuth");
    showOrganizer(res.organizer || [], res.recent || []);
  }catch(e){
    showMsg("authMsg","通信できませんでした");
  }finally{
    btn.disabled = false; btn.textContent = "ひらく";
  }
};

function showOrganizer(rows, recent){
  /* 最近みんなが追加したリンク（新しい順・5件） */
  const rb = $("recentBox");
  rb.textContent = "";
  if(recent.length){
    const box = el("div","recent");
    box.appendChild(el("div","cat-title","🆕 最近みんなが追加したリンク"));
    recent.forEach(function(r){
      const it = el("div","r-item");
      const body = el("div","r-body");
      body.appendChild(el("div","r-title", r.title || ""));
      body.appendChild(el("div","r-sub", (r.author ? r.author + "さん ・ " : "") + (r.url || "")));
      const b = el("button", null, "非表示にする");
      b.onclick = async function(){
        try{
          const res = await api({ action:"organizerHideLink", token:TOKEN, id:r.id });
          if(!res.ok){ alert(res.error || "できませんでした"); return; }
          it.remove(); refresh();
        }catch(e){ alert("通信できませんでした"); }
      };
      it.appendChild(body); it.appendChild(b);
      box.appendChild(it);
    });
    rb.appendChild(box);
  }

  /* 幹事業務 ／ システム管理（取扱注意） の2つに分ける */
  const list = $("orgList");
  list.textContent = "";
  const sys = rows.filter(function(r){ return String(r.category).indexOf("システム") === 0; });
  const biz = rows.filter(function(r){ return String(r.category).indexOf("システム") !== 0; });

  if(biz.length){
    const box = el("div");
    renderByCategory(box, biz);
    list.appendChild(box);
  }
  if(sys.length){
    const box = el("div","sys-block");
    box.appendChild(el("div","org-warn", TEXTS.sysWarn));
    const inner = el("div");
    renderByCategory(inner, sys);
    box.appendChild(inner);
    list.appendChild(box);
  }

  $("publicView").style.display = "none";
  $("organizerView").style.display = "block";
  window.scrollTo(0,0);
}
$("btnBackPublic").onclick = function(){
  $("organizerView").style.display = "none";
  $("publicView").style.display = "block";
  window.scrollTo(0,0);
};

/* パスワード変更 */
$("btnChangePw").onclick = function(){
  ["fPwNow","fPwNew","fPwNew2"].forEach(function(id){ $(id).value = ""; });
  hideMsg("pwMsg"); openOv("ovPw");
};
$("btnSavePw").onclick = async function(){
  const cur = $("fPwNow").value, n1 = $("fPwNew").value, n2 = $("fPwNew2").value;
  if(!cur || !n1){ showMsg("pwMsg","すべて入れてください"); return; }
  if(n1 !== n2){ showMsg("pwMsg","新しいパスワードが2つでちがっています"); return; }
  if(!/^[A-Za-z0-9]{6,}$/.test(n1)){ showMsg("pwMsg","新しいパスワードは英数字6文字以上にしてください"); return; }
  const btn = this; btn.disabled = true; btn.textContent = "変更中…";
  try{
    const res = await api({ action:"changePassword", token:TOKEN, current:cur, next:n1 });
    if(!res.ok){ showMsg("pwMsg", res.error || "変更できませんでした"); return; }
    showMsg("pwMsg","変更しました ✓ 新しいパスワードを忘れずに！", true);
    setTimeout(function(){ closeOv("ovPw"); }, 1200);
  }catch(e){
    showMsg("pwMsg","通信できませんでした");
  }finally{
    btn.disabled = false; btn.textContent = "変更する";
  }
};

/* 開いたときの処理 */
try{ TOKEN = sessionStorage.getItem("orangeOrgToken") || ""; }catch(e){}
loadLinks();
</script>
