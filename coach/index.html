const CoachCore = (function () {
  const MIN_N = 10;            // これより 答えた 数が 少ない 考え方・問題は「データ不足」。上位3つに 入れない
  const TREND_POINTS = 5;      // 先週と くらべて この ポイント以上 ちがえば「良くなった／悪くなった」

  function rate(x) { return x && x.n ? x.ok / x.n : null; }
  function pct(r) { return r === null ? '' : Math.round(r * 100); }
  function enough(x) { return !!x && x.n >= MIN_N; }

  // 正答率の 低い 順。同じなら 答えた 数の 多い 順、それも 同じなら キーの 順。データ不足は うしろ（答えた 数の 多い 順）
  function order(a, b) {
    if (a.enough !== b.enough) return a.enough ? -1 : 1;
    if (a.enough) {

      if (a.n !== b.n) return b.n - a.n;

    return Object.keys(box || {}).filter(function (k) { return !names || names[k]; }).map(function (k) {

  function trend(report, band, tag) {
    const b = report && report.bands && report.bands[band];
    const now = b && b.week && b.week.tags[tag];
    const prev = b && b.prevWeek && b.prevWeek.tags[tag];
    if (!enough(now) || !enough(prev)) return { kind: 'none', diff: null };
    const diff = Math.round(rate(now) * 100) - Math.round(rate(prev) * 100);
    if (diff >= TREND_POINTS) return { kind: 'up', diff: diff };
    if (diff <= -TREND_POINTS) return { kind: 'down', diff: diff };
    return { kind: 'flat', diff: diff };
  }

  // クイズで 見せる 問題：その 考え方の 問題の うち、データが 足りて いて 正答率が いちばん 低い もの。なければ 練習メニュー.md の「クイズ：」
  function playKeyFor(report, band, period, tag, data) {
    const items = slice(report, band, period).items;
    const list = rows(items).filter(function (r) {
      const it = data.items[r.key];
      return r.enough && it && it.play && it.tags.indexOf(tag) >= 0;
    });
    if (list.length) return data.items[list[0].key].play;
    return (data.tags[tag] && data.tags[tag].quiz) || '';
  }

  // 上位3つ（苦手）：データが 足りて いる 考え方を 正答率の 低い 順に 3つ
  function top(report, band, period, data) {
    return rows(slice(report, band, period).tags, data.tags).filter(function (r) { return r.enough; }).slice(0, TOP).map(function (r) {
      return Object.assign(r, { trend: trend(report, band, r.key), play: playKeyFor(report, band, period, r.key, data) });
    });
  }

  function tagRows(report, band, period, data) { return rows(slice(report, band, period).tags, data.tags); }
  function itemRows(report, band, period) { return rows(slice(report, band, period).items); }
  function fastCount(report, band, period) {
    const items = slice(report, band, period).items;
    return Object.keys(items).reduce(function (s, k) { return s + (items[k].fast || 0); }, 0);
  }
  function playUrl(key) { return '../quiz/index.html?play=' + encodeURIComponent(key); }

  return { MIN_N: MIN_N, TREND_POINTS: TREND_POINTS, rate: rate, pct: pct, rows: rows, trend: trend, top: top,
    tagRows: tagRows, itemRows: itemRows, playKeyFor: playKeyFor, fastCount: fastCount, playUrl: playUrl };
})();
</script>

<script id="app">
(function () {
  const C = CoachCore, D = COACH_DATA;
  const $ = function (id) { return document.getElementById(id); };
  const CACHE = 'orange_coach_cache_v1';   // チーム全体の 集計だけを この 端末に 残す（電波が 弱い ときに 使う）
  const S = { period: 'recent', band: 'all', view: 'top', report: null, at: '' };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
  }
  function tagName(k) { return (D.tags[k] && D.tags[k].name) || k; }
  function itemName(k) { return (D.items[k] && D.items[k].name) || ('問題 ' + k); }
  function itemDetail(k) { return (D.items[k] && D.items[k].detail) || ''; }

  function trendHTML(t) {
    if (t.kind === 'up') return '<span class="trend up">↑ 先週より 良くなった（+' + t.diff + '）</span>';
    if (t.kind === 'down') return '<span class="trend down">↓ 先週より 悪くなった（' + t.diff + '）</span>';
    if (t.kind === 'flat') return '<span class="trend flat">→ 先週と ほぼ同じ</span>';
    return '<span class="trend none">先週との比較：データ不足</span>';
  }
  function playBtn(key, label) {
    if (!key) return '';
    return '<a class="btn" target="_blank" rel="noopener" href="' + esc(C.playUrl(key)) + '">▶ ' + esc(label) +
      '<small>（' + esc(itemName(key)) + '）</small></a>';
  }

  function drawTop() {
    const list = S.report ? C.top(S.report, S.band, S.period, D) : [];
    if (!S.report) { $('top').innerHTML = '<p class="empty">データを読みこめていません。電波のよい所で「更新」を押してください。</p>'; return; }
    if (!list.length) {
      $('top').innerHTML = '<p class="empty">この期間・学年では、答えた数が' + C.MIN_N + '回以上の考え方がまだありません。' +
        (S.period === 'recent' ? '期間を「全期間」にすると出るかもしれません。' : '') + '</p>';
      return;
    }
    $('top').innerHTML = list.map(function (r, i) {
      const t = D.tags[r.key] || { menu: [], talk: '', checked: false };
      const p = C.pct(r.rate);
      return '<article class="card" data-tag="' + esc(r.key) + '">' +
        '<div class="card-head"><span class="rank" aria-label="' + (i + 1) + '位">' + (i + 1) + '</span><h3>' + esc(tagName(r.key)) + '</h3></div>' +
        '<div class="nums"><span class="rate">' + p + '<small>%</small></span><span class="count">正答率・答えた数 ' + r.n + '回</span></div>' +
        '<div class="bar" aria-hidden="true"><i style="width:' + p + '%"></i></div>' +
        trendHTML(r.trend) +
        '<h4>おすすめの練習</h4><ul>' + t.menu.map(function (m) { return '<li>' + esc(m) + '</li>'; }).join('') + '</ul>' +
        '<h4>子供への声かけ</h4><p class="talk">「' + esc(t.talk) + '」</p>' +
        playBtn(r.play, 'クイズで見せる') +
        '<p class="checked">' + (t.checked ? '✔ 練習メニューはチームで確認ずみ' : '練習メニューは案です（まだチームで確認していません）') + '</p>' +
        '</article>';
    }).join('');
  }

  function rateCells(r) {
    if (!r.enough) return '<td class="num"><span class="lack">データ不足</span><small>' + r.n + '回</small></td>';
    return '<td class="num">' + C.pct(r.rate) + '%<small>' + r.n + '回</small></td>';
  }
  function drawDetail() {
    if (!S.report) { $('tagTable').innerHTML = ''; $('itemTable').innerHTML = '<p class="empty">データを読みこめていません。</p>'; return; }
    const tags = C.tagRows(S.report, S.band, S.period, D);
    $('tagTable').innerHTML = tags.length ? '<table><thead><tr><th>考え方</th><th style="text-align:right">正答率・答えた数</th></tr></thead><tbody>' +
      tags.map(function (r) { return '<tr data-tag="' + esc(r.key) + '"><td class="iname">' + esc(tagName(r.key)) + '</td>' + rateCells(r) + '</tr>'; }).join('') +
      '</tbody></table>' : '<p class="empty">この期間・学年のデータはまだありません。</p>';
    const items = C.itemRows(S.report, S.band, S.period);
    $('itemTable').innerHTML = items.length ? '<table><thead><tr><th>問題</th><th style="text-align:right">正答率・答えた数</th></tr></thead><tbody>' +
      items.map(function (r) {
        const it = D.items[r.key];
        return '<tr data-item="' + esc(r.key) + '"><td><span class="iname">' + esc(itemName(r.key)) + '</span>' +
          (itemDetail(r.key) ? '<span class="idetail">' + esc(itemDetail(r.key)) + '</span>' : '') +
          (it && it.play ? '<a class="play" target="_blank" rel="noopener" href="' + esc(C.playUrl(it.play)) + '">▶ クイズで見せる</a>' : '') +
          '</td>' + rateCells(r) + '</tr>';
      }).join('') + '</tbody></table>' : '<p class="empty">この期間・学年のデータはまだありません。</p>';
  }

  function drawRules() {
    if (!S.report) { $('rules').textContent = ''; return; }
    const rg = S.report.ranges || {};
    const range = S.period === 'recent' && rg.recent ? '直近2週間（' + rg.recent.from + '〜' + rg.recent.to + '）' : '全期間';
    $('rules').textContent = range + '・' + { all: '全体', low: '低学年（1〜3年）', high: '高学年（4〜6年）' }[S.band] +
      'のチーム全体の集計です。2秒未満の答え（' + C.fastCount(S.report, S.band, S.period) + '回）は除いています。答えた数が' + C.MIN_N +
      '回未満は「データ不足」として、上位3つに入れません。先週との比較は、今日までの7日とその前の7日をくらべています。';
  }

  function draw() {
    document.querySelectorAll('[data-period]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-period') === S.period)); });
    document.querySelectorAll('[data-band]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-band') === S.band)); });
    document.querySelectorAll('[data-view]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-view') === S.view)); });
    $('viewTop').hidden = S.view !== 'top';
    $('viewDetail').hidden = S.view !== 'detail';
    if (S.view === 'top') drawTop(); else drawDetail();
    drawRules();
  }

  function stamp(d) {
    return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + d.getHours() + ':' + ('0' + d.getMinutes()).slice(-2);
  }
  function load() {
    $('status').textContent = '読みこみ中…';
    const ok = typeof GAS_URL === 'string' && /^https:\/\/script\.google\.com\//.test(GAS_URL);
    const req = ok ? fetch(GAS_URL + '?action=coach').then(function (r) { return r.json(); }) : Promise.reject(new Error('no url'));
    return Promise.race([req, new Promise(function (res, rej) { setTimeout(function () { rej(new Error('timeout')); }, 15000); })])
      .then(function (j) {
        if (!j || !j.ok || !j.bands) throw new Error('bad');
        S.report = j; S.at = stamp(new Date());
        try { localStorage.setItem(CACHE, JSON.stringify({ at: S.at, report: j })); } catch (e) { /* 保存できなくても 表示は できる */ }
        $('status').textContent = S.at + ' の最新データ';
      })
      .catch(function () {
        let c = null;
        try { c = JSON.parse(localStorage.getItem(CACHE) || 'null'); } catch (e) { c = null; }
        if (c && c.report) { S.report = c.report; S.at = c.at; $('status').textContent = '読みこめませんでした。' + c.at + ' のデータを表示しています'; }
        else $('status').textContent = '読みこめませんでした。電波のよい所で「更新」を押してください';
      })
      .then(draw);
  }

  document.querySelectorAll('[data-period]').forEach(function (b) { b.onclick = function () { S.period = b.getAttribute('data-period'); draw(); }; });
  document.querySelectorAll('[data-band]').forEach(function (b) { b.onclick = function () { S.band = b.getAttribute('data-band'); draw(); }; });
  document.querySelectorAll('[data-view]').forEach(function (b) { b.onclick = function () { S.view = b.getAttribute('data-view'); window.scrollTo(0, 0); draw(); }; });
  $('btnDetail').onclick = function () { S.view = 'detail'; window.scrollTo(0, 0); draw(); };
  $('btnReload').onclick = load;
  draw();
  load();
})();
</script>
</body>
</html>
