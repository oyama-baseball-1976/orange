<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 ティーボール大会 お疲れ様会</title>
<!--
  ============================================================
  発表用スライドページ（お疲れ様会 表彰演出）
  ver007：チームのきせきのしめ演出＋個人表彰の導入スライド
    ・チームのきせき：カード全部のあと、最後のクリックで「みんなすごい！」＋紙吹雪＋歓声
    　（歓声＝sounds/cheer.mp3。無ければ合成拍手で代用。文言はTEAM_WOW定数）
    ・チームのきせきの次に「今から 個人表彰！」の導入スライド（山吹色・紙吹雪つき。文言はAWARD_INTRO定数）
  ver006：しめの前にセレモニー3枚を追加
    ・はじめての記録②のあと：礼（監督・コーチへ ありがとうございました）
    　→ 小林コーチのひとこと → 前川監督のひとこと → しめ
    ・文言・名前は DATA の下の CEREMONY 定数で変更（データ取込で消えない）
  ver005：チームのきせきを順次表示に変更
    ・最初はタイトルのみ→クリックごとにカード（せいせき→通算ヒット→総得点→勢い）を1枚ずつ発表
    ・←キーで1枚ずつ巻き戻し。全部出たら次のクリックで次のスライドへ
  ver004：BGM対応
    ・sounds/bgm.mp3 を置くと、最初の操作からループ再生（無ければ鳴らない）
    ・音量は BGM_VOLUME（ふだん）/ BGM_DUCK（ドラムロール〜発表中）で調整
    ・Bキー＝BGMだけON/OFF、Mキー＝効果音もBGMも全部ON/OFF
  ver003：進行を「賞→その子のインタビュー」交互に変更
    ・全児童がAWARD/SPECIAL AWARDを受賞する前提（発表→お菓子→意気込みインタビュー）
    ・ポジション別MVPスライドは廃止（DATAのposAwardsは残るが表示しない）
    ・はじめての記録は「しめ」の直前（8人超は2枚に自動分割）
    ・HERO INTERVIEWは写真あり横並びの1種類に統一（未配置はプレースホルダー枠）
  ver002：デザイン「ステッカーポップ」適用（機能・演出・データ取込はver001と同一）
  ver001：音のMP3対応（sounds/）＋顔写真対応（photos/）
  ・同じ場所に sounds/ と photos/ フォルダを置いて使う（すべてローカル＝オフラインで動く）。
    sounds/drumroll.mp3 … ドラムロール（発表前のタメ）
    sounds/fanfare.mp3  … 名前登場のジャジャーン
    sounds/applause.mp3 … 拍手
    photos/01.jpg, 02.jpg … 顔写真（名簿順の番号。無い子は名前だけの表示になる）
  ・MP3が無い／読めないときは、従来のWebAudio合成音で代用（必ず音が出る）。
  ・操作：クリック / → / Space / Enter / PageDown = 進む
          ← / PageUp = 戻る（賞スライドは発表前の状態に戻る）
          Home = 最初へ / End = 最後へ
          F = 全画面の切り替え ／ M = 効果音のON/OFF ／ D = データ取込（幹事用）
  ・賞スライドは3段階：賞名 →（操作）ドラムロール🥁 → 受賞者名がバーン＋紙吹雪
    （ドラムロール中にもう一度操作すると、すぐ発表にスキップ）
  ============================================================
-->
<style>
  :root{
    --ink:#21324B; --orange:#F0662A; --bg:#FFF6DF; --muted:#7A6E55;
    --green:#2C9E6B; --red:#E9505F; --blue:#3D7DD8; --yellow:#E89A00;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{height:100%;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    background:var(--bg); color:var(--ink); overflow:hidden; cursor:pointer;
  }
  /* 背景のドット紙（シール帳の下地） */
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:radial-gradient(#F2DFAE 2.5px, transparent 3px);
    background-size:30px 30px;
  }

  /* ===== スライド共通 ===== */
  .slide{
    position:absolute; inset:0; display:none;
    flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:4vh 5vw; z-index:1;
  }
  .slide.active{display:flex;}
  /* 自動フィット枠：中身が画面より大きいときJSで縮小（人数が多くてもはみ出さない） */
  .fitbox{display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .inner{display:flex; flex-direction:column; align-items:center; justify-content:center; animation:fadeUp .45s ease both; max-width:96vw;}
  .s-label{font-size:clamp(16px,2.2vw,30px); font-weight:800; color:var(--muted); letter-spacing:.18em;}
  .s-title{font-size:clamp(34px,6vw,84px); font-weight:900; line-height:1.25; margin:2vh 0;}
  .s-sub{font-size:clamp(16px,2.2vw,30px); color:var(--muted);}

  /* ベタ色背景スライド（各賞・MVP・しめ）：ドット紙の質感＋文字は白 */
  .slide.grad{
    color:#fff;
    background-image:radial-gradient(rgba(33,50,75,.10) 2.5px, transparent 3px);
    background-size:30px 30px;
  }
  .slide.grad .s-label{
    background:var(--ink); color:#FFE9A8; border-radius:999px;
    padding:.7vh 2.4vw; letter-spacing:.2em;
  }

  /* ===== 表紙（ステッカー看板＋テープ帯） ===== */
  .cover-emoji{font-size:clamp(50px,9vw,120px); animation:floaty 2.6s ease-in-out infinite;}
  .cover-board{
    background:#fff; border:5px solid var(--ink); border-radius:26px; box-shadow:12px 12px 0 var(--ink);
    padding:4vh 5vw; display:flex; flex-direction:column; align-items:center;
    --tilt:-1.5deg; animation:popIn .55s ease both;
  }
  .cover-title{
    font-size:clamp(34px,6.2vw,88px); font-weight:900; line-height:1.3; margin:1.5vh 0; color:var(--ink);
  }
  .cover-team{
    background:var(--orange); color:#fff; border:3px solid var(--ink); border-radius:999px;
    box-shadow:4px 4px 0 var(--ink); padding:.8vh 2.4vw;
    font-size:clamp(14px,1.8vw,26px); font-weight:900;
  }
  .cover-tape{
    position:absolute; color:#fff; font-weight:900; letter-spacing:.25em;
    border:3px solid var(--ink); box-shadow:5px 5px 0 var(--ink);
    padding:1vh 4vw; font-size:clamp(13px,1.6vw,24px); z-index:2;
  }
  .tape-l{top:7vh; left:-1.5vw; background:var(--blue); transform:rotate(-7deg);}
  .tape-r{bottom:8vh; right:-1.5vw; background:var(--green); transform:rotate(6deg);}
  .cover-hint{
    margin-top:5vh; font-size:clamp(12px,1.5vw,19px); color:var(--muted);
    background:#fff; border:3px solid var(--ink); border-radius:14px; box-shadow:4px 4px 0 var(--ink);
    padding:10px 22px; line-height:1.9;
  }

  /* ===== チーム振り返り ===== */
  .team-grid{display:flex; flex-wrap:wrap; gap:2vw; justify-content:center; margin-top:3vh;}
  /* ver005：カードを1枚も出していないときの案内（クリックで順次発表） */
  .team-hint{
    margin-top:4vh; font-size:clamp(18px,2.4vw,34px); font-weight:800; color:var(--muted);
    animation:pulse 1.4s ease-in-out infinite;
  }
  /* ver007：カード全部のあとに出る「みんなすごい！」（紙吹雪＋歓声つき） */
  .team-wow{
    margin-top:3.5vh; font-size:clamp(40px,7vw,96px); font-weight:900; color:var(--orange);
    text-shadow:4px 4px 0 var(--ink);
    animation:bam .6s cubic-bezier(.2,1.4,.4,1) both;
  }
  .big-card{
    color:#fff; border-radius:22px; padding:3vh 3vw; min-width:220px;
    border:4px solid var(--ink); box-shadow:8px 8px 0 var(--ink); animation:popIn .55s ease both;
  }
  .big-card .lbl{font-size:clamp(14px,1.8vw,26px); font-weight:800; opacity:.92;}
  .big-card .val{font-size:clamp(40px,6.5vw,96px); font-weight:900; line-height:1.15; text-shadow:0 3px 10px rgba(0,0,0,.18);}
  .big-card .unit{font-size:clamp(16px,2vw,30px); font-weight:800;}
  .big-card .sub{font-size:clamp(12px,1.4vw,20px); opacity:.92; font-weight:700;}

  /* ===== 各賞スライド ===== */
  .award-emoji{font-size:clamp(60px,10vw,140px); animation:floaty 2.4s ease-in-out infinite;}
  .award-name{
    font-size:clamp(36px,6.5vw,92px); font-weight:900; margin:1.5vh 0 2vh;
    text-shadow:4px 4px 0 var(--ink);
  }
  .award-wait{
    margin-top:3.5vh; font-size:clamp(20px,3vw,44px); font-weight:800;
    color:rgba(255,255,255,.92); animation:pulse 1.4s ease-in-out infinite;
  }
  /* ドラムロール中 */
  .drumroll{margin-top:3vh; animation:shakeX .12s linear infinite;}
  .drumroll .dr-emoji{font-size:clamp(60px,9vw,130px);}
  .drumroll .dr-text{font-size:clamp(22px,3.4vw,50px); font-weight:900; letter-spacing:.2em; margin-top:1vh; text-shadow:3px 3px 0 var(--ink);}
  /* 受賞者バーン（白いステッカーカードで登場） */
  .winner-name{
    font-size:clamp(52px,9vw,140px); font-weight:900; line-height:1.2; color:var(--orange);
    background:#fff; border:5px solid var(--ink); border-radius:24px; box-shadow:10px 10px 0 var(--ink);
    padding:1.5vh 4vw; -webkit-text-stroke:2px var(--ink);
    --tilt:-2deg; animation:bam .6s cubic-bezier(.2,1.4,.4,1) both;
  }
  .winner-value{font-size:clamp(22px,3.2vw,46px); font-weight:900; margin-top:2.2vh;
    background:var(--ink); color:#FFE9A8; border-radius:999px; padding:.6vh 2.6vw;
    animation:fadeUp .5s .25s ease both;}
  .winner-comment{font-size:clamp(16px,2.2vw,32px); color:#fff; text-shadow:2px 2px 0 rgba(33,50,75,.55); margin-top:1.8vh; font-weight:800; animation:fadeUp .5s .4s ease both;}

  /* ===== 初めて記録 ===== */
  .firsts-grid{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:1.5vh 1.5vw; margin-top:3vh; width:min(1200px,92vw);
  }
  .first-card{
    background:#fff; border:3px solid var(--ink); border-radius:14px;
    padding:1.4vh 1.2vw; text-align:left; box-shadow:5px 5px 0 var(--ink);
    animation:popIn .45s ease both;
  }
  .first-card .fc-name{font-size:clamp(16px,1.9vw,28px); font-weight:900;}
  .first-card .fc-tags{font-size:clamp(12px,1.4vw,20px); margin-top:.5vh; line-height:1.8;}
  .first-card .fc-tags span{display:inline-block; background:#FFEFD1; border-radius:999px; padding:1px 10px; margin:1px 3px 1px 0; font-weight:700;}

  /* ===== 一人ひとり ===== */
  /* 写真がある子：写真＋（名前・賞・スタンプ）の横並び。無い子は従来の中央縦配置 */
  .child-flex{display:flex; align-items:center; justify-content:center; gap:3.5vw; margin-top:1.5vh;}
  .child-photo{
    width:clamp(220px,26vw,400px); aspect-ratio:3/4; object-fit:cover;
    border-radius:8px; border:5px solid var(--ink);
    box-shadow:10px 10px 0 var(--ink);
    --tilt:-3deg; animation:popIn .55s cubic-bezier(.2,1.4,.4,1) both;
    background:#fff;
  }
  .child-col{display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .child-flex .child-name{font-size:clamp(40px,7vw,104px);}   /* 写真がある分すこし控えめに */
  /* 写真未配置の子のプレースホルダー枠（.child-photoと同寸で、レイアウトを崩さない） */
  .child-photo-ph{
    display:flex; align-items:center; justify-content:center;
    font-size:clamp(64px,9vw,140px); background:#FFF6DF;
  }
  /* インタビューのお題（🎤 投げ試合への意気込み） */
  .child-mic{
    margin-top:2.2vh; background:#fff; border:3px solid var(--ink); border-radius:999px;
    box-shadow:4px 4px 0 var(--ink); padding:1vh 2.6vw;
    font-weight:900; font-size:clamp(14px,2vw,30px); color:var(--ink);
    animation:fadeUp .5s .55s ease both;
  }
  .child-name{
    font-size:clamp(44px,8vw,116px); font-weight:900; line-height:1.2; color:var(--ink);
    background:#fff; border:4px solid var(--ink); border-radius:20px; box-shadow:7px 7px 0 var(--ink);
    padding:.8vh 2.6vw;
    --tilt:1.5deg; animation:bam .55s cubic-bezier(.2,1.4,.4,1) both;
  }
  .child-award{
    margin-top:2.5vh; color:#fff; border-radius:18px; padding:2vh 3.4vw;
    font-size:clamp(20px,3vw,44px); font-weight:900;
    border:3px solid var(--ink); box-shadow:6px 6px 0 var(--ink);
    --tilt:-1deg; animation:popIn .5s .15s ease both;
  }
  .child-award .ca-value{font-size:clamp(14px,1.8vw,26px); font-weight:800; opacity:.95; margin-top:.4vh;}
  .child-award .ca-comment{font-size:clamp(13px,1.6vw,22px); font-weight:700; opacity:.95; margin-top:.4vh;}
  .child-stamps{margin-top:2.2vh; animation:fadeUp .5s .3s ease both;}
  .child-stamps .cs-lbl{font-size:clamp(13px,1.5vw,20px); color:var(--muted); display:block; margin-bottom:.8vh; font-weight:800; letter-spacing:.1em;}
  .child-stamps .cs-row{display:flex; gap:.7vw; justify-content:center;}
  .child-stamps .cs-row i{
    font-style:normal; font-size:clamp(20px,2.8vw,40px);
    background:#fff; border:3px solid var(--ink); border-radius:50%; box-shadow:3px 3px 0 var(--ink);
    width:1.9em; height:1.9em; display:flex; align-items:center; justify-content:center;
  }
  .child-totals{margin-top:2.4vh; font-size:clamp(15px,2vw,28px); animation:fadeUp .5s .42s ease both;}
  .child-totals b{color:var(--orange); font-size:clamp(20px,2.6vw,38px);}

  /* ===== しめ ===== */
  .closing-msg{font-size:clamp(38px,6.5vw,92px); font-weight:900; line-height:1.35; color:var(--ink);
    background:#fff; border:5px solid var(--ink); border-radius:26px; box-shadow:12px 12px 0 var(--ink);
    padding:3vh 5vw; margin-top:2vh;
    --tilt:-1.5deg; animation:bam .6s cubic-bezier(.2,1.4,.4,1) both;}
  .closing-note{margin-top:4vh; font-size:clamp(20px,3vw,44px); font-weight:800; color:#fff; text-shadow:2px 2px 0 rgba(33,50,75,.55); animation:fadeUp .5s .35s ease both;}

  /* ===== 紙吹雪 ===== */
  .confetti{position:fixed; inset:0; pointer-events:none; z-index:20; overflow:hidden;}
  .confetti i{position:absolute; top:-24px; display:block; animation:fall linear forwards;}

  /* ===== 進捗・音インジケーター ===== */
  #progress{
    position:fixed; right:14px; bottom:10px; font-size:13px; color:var(--ink); font-weight:700;
    background:#fff; border:2px solid var(--ink); border-radius:999px; padding:3px 12px; z-index:30;
  }
  #soundInd{
    position:fixed; left:14px; bottom:10px; font-size:13px; color:var(--ink); font-weight:700;
    background:#fff; border:2px solid var(--ink); border-radius:999px; padding:3px 12px; z-index:30;
  }
  #bgmInd{
    position:fixed; left:14px; bottom:44px; font-size:13px; color:var(--ink); font-weight:700;
    background:#fff; border:2px solid var(--ink); border-radius:999px; padding:3px 12px; z-index:30;
  }

  /* ===== データ取込画面（Dキー・幹事用） ===== */
  #importOverlay{position:fixed; inset:0; background:rgba(20,25,45,.6); z-index:50; display:none;
    align-items:center; justify-content:center; cursor:auto;}
  #importOverlay.open{display:flex;}
  .imp-box{background:#fff; border-radius:16px; width:min(780px,94vw); max-height:92vh; overflow:auto;
    padding:22px 24px; text-align:left; box-shadow:0 16px 48px rgba(0,0,0,.3);}
  .imp-box h2{margin:0 0 4px; font-size:1.05rem;}
  .imp-note{font-size:.78rem; color:var(--muted); line-height:1.7;}
  .imp-box label{font-size:.8rem; font-weight:800; display:block; margin-top:12px;}
  .imp-box input{width:100%; padding:9px 10px; border:1px solid #d5d9e3; border-radius:8px; font-size:.85rem;}
  .imp-btn{margin-top:14px; margin-right:8px; padding:10px 20px; border-radius:10px; border:none;
    background:var(--orange); color:#fff; font-weight:800; font-size:.9rem; cursor:pointer;}
  .imp-btn.gray{background:#8a90a3;}
  .imp-btn:disabled{opacity:.5;}
  #impStatus{font-size:.84rem; margin-top:12px; white-space:pre-wrap; line-height:1.7;}
  #impOut{width:100%; height:210px; margin-top:10px; font-family:Consolas,monospace; font-size:11px;
    border:1px solid #d5d9e3; border-radius:8px; padding:8px;}

  /* ===== アニメーション定義 ===== */
  @keyframes fadeUp{from{opacity:0; transform:translateY(28px);} to{opacity:1; transform:none;}}
  /* --tilt：シールの傾き。アニメ終了後も傾きが残るようにキーフレーム側で参照する */
  @keyframes popIn{0%{opacity:0; transform:scale(.55);} 70%{opacity:1; transform:scale(1.07) rotate(var(--tilt,0deg));} 100%{opacity:1; transform:scale(1) rotate(var(--tilt,0deg));}}
  @keyframes bam{0%{opacity:0; transform:scale(.15) rotate(-7deg);} 55%{opacity:1; transform:scale(1.22) rotate(2deg);} 75%{transform:scale(.96) rotate(var(--tilt,0deg));} 100%{opacity:1; transform:scale(1) rotate(var(--tilt,0deg));}}
  @keyframes floaty{0%,100%{transform:translateY(0);} 50%{transform:translateY(-12px);}}
  @keyframes pulse{0%,100%{opacity:.65;} 50%{opacity:1;}}
  @keyframes shakeX{0%{transform:translate(0,0);} 25%{transform:translate(3px,-2px);} 50%{transform:translate(-3px,2px);} 75%{transform:translate(2px,1px);} 100%{transform:translate(0,0);}}
  @keyframes fall{to{transform:translateY(112vh) rotate(720deg);}}
</style>
</head>
<body>

<div id="stage"></div>
<div id="soundInd">🔊 音ON（Mで切替）</div>
<div id="bgmInd">🎵 BGM ON（Bで切替）</div>
<div id="progress">- / -</div>

<!-- ===== データ取込画面（Dキーで開閉・幹事用。当日は使わない） ===== -->
<div id="importOverlay">
  <div class="imp-box">
    <h2>📥 データ取込（幹事用）</h2>
    <p class="imp-note">
      集計システムのGASから確定データを取得し、このページに焼き込む「DATAブロック」を生成します。<br>
      <b>ネット接続が必要なのはこの取込だけ</b>です。生成したテキストを
      presentation_1b_sticker.html の <b>/* ==== DATA START ==== */ 〜 /* ==== DATA END ==== */</b> と丸ごと貼り替えれば、
      当日はオフラインで動きます。賞の計算は既存の表彰画面と同じ「1人1賞」ロジックです。
    </p>
    <label>GASのウェブアプリURL（/exec まで）</label>
    <input id="impUrl" type="text" placeholder="https://script.google.com/macros/s/…/exec">
    <label>年度（空欄＝今年度）</label>
    <input id="impYear" type="text" placeholder="例：2026">
    <button class="imp-btn" id="impRun">取得して生成</button>
    <button class="imp-btn gray" id="impClose">閉じる（Dキーでも閉じます）</button>
    <div id="impStatus"></div>
    <textarea id="impOut" spellcheck="false" placeholder="ここに生成結果が出ます"></textarea>
    <button class="imp-btn" id="impCopy" disabled>生成結果をコピー</button>
  </div>
</div>

<script>
/* ============================================================
   発表データ（ここを差し替え・微調整する）
   ・いまはサンプルデータ。本番は締め切り後に確定データへ差し替える。
   ・構造は本番と同一。文字を直せばそのまま画面に反映される。
   ============================================================ */
/* ==== DATA START ==== */
const DATA = {
  /* 表紙 */
  title: "2026 ティーボール大会\nお疲れ様会",
  subtitle: "小山少年野球団 オレンジ",

  /* チーム振り返り（大きな数字で見せる） */
  team: {
    win: 5, lose: 2, draw: 1,        // 勝敗
    gf: 48, ga: 30,                  // 総得点・総失点
    teamHits: 62,                    // みんなの通算ヒット
    totalGames: 8,                   // 試合数
    streak: 3,                       // いまの連勝（0なら表示なし）

const SOUNDS={
  drumroll:"sounds/drumroll.mp3",   // 受賞者発表前のタメ

  Object.keys(SOUNDS).forEach(k=>{
    const a=new Audio();
    _audio[k]={el:a, failed:false};
    a.addEventListener("error",()=>{_audio[k].failed=true;});
    a.preload="auto"; a.src=SOUNDS[k]; a.load();
  });
})();
/* MP3を再生できたら true。false のときは呼び出し側が合成音で代用する */
function playSound(k){
  const s=_audio[k];
  if(muted||!s||s.failed)return false;
  try{
    s.el.currentTime=0;
    const p=s.el.play();
    /* 「ファイルが再生不能」のときだけ合成音に切替。
       AbortError（ロール中の早送りスキップ等で直後にpauseした場合）は正常動作なので無視 */
    if(p&&p.catch)p.catch(err=>{if(err&&err.name==="NotSupportedError")s.failed=true;});
    return true;
  }catch(e){return false;}
}
function stopSound(k){
  const s=_audio[k];
  if(s&&s.el){try{s.el.pause();s.el.currentTime=0;}catch(e){}}
}
function stopAllSounds(){Object.keys(_audio).forEach(stopSound);}

/* ============================================================
   BGM（sounds/bgm.mp3 を置くと最初の操作からループ再生。無ければ鳴らない）
   ・音量は BGM_VOLUME で調整（効果音より控えめに）
   ・ドラムロール〜発表の間は自動で音量を下げる（効果音を聞かせるため）
   ・Bキー＝BGMだけON/OFF、Mキー＝効果音もBGMも全部ON/OFF
   ============================================================ */
const BGM_FILE="sounds/bgm.mp3";
const BGM_VOLUME=0.13;   /* ふだんの音量（0〜1） */
const BGM_DUCK=0.07;     /* ドラムロール〜発表中に下げた音量 */
let bgmEl=null, bgmWanted=true, bgmStarted=false, bgmFailed=false;
(function initBgm(){
  bgmEl=new Audio();
  bgmEl.loop=true; bgmEl.preload="auto"; bgmEl.volume=BGM_VOLUME;
  bgmEl.addEventListener("error",()=>{bgmFailed=true;updateBgmInd();});
  bgmEl.src=BGM_FILE; bgmEl.load();
})();
/* 最初の操作のときに呼ぶ（ブラウザの自動再生制限対応） */
function bgmStart(){
  if(bgmStarted||muted||!bgmWanted||bgmFailed)return;
  const p=bgmEl.play();
  if(p&&p.then)p.then(()=>{bgmStarted=true;updateBgmInd();}).catch(()=>{});
  else{bgmStarted=true;updateBgmInd();}
}
function bgmPause(){try{bgmEl.pause();}catch(e){}}
function bgmResume(){if(!muted&&bgmWanted&&bgmStarted&&!bgmFailed){const p=bgmEl.play();if(p&&p.catch)p.catch(()=>{});}}
function bgmToggle(){ /* Bキー：BGMだけのON/OFF */
  bgmWanted=!bgmWanted;
  if(bgmWanted){if(bgmStarted)bgmResume();else bgmStart();}
  else bgmPause();
  updateBgmInd();
}
let bgmDuckTimer=null;
function bgmDuck(low){
  if(bgmDuckTimer){clearTimeout(bgmDuckTimer);bgmDuckTimer=null;}  // 予約済みの復帰をキャンセル（連打対策）
  if(bgmEl)bgmEl.volume=low?BGM_DUCK:BGM_VOLUME;
}
function bgmDuckRestoreLater(ms){  // 発表の効果音が落ち着いてからBGM音量を戻す
  if(bgmDuckTimer)clearTimeout(bgmDuckTimer);
  bgmDuckTimer=setTimeout(()=>{bgmDuckTimer=null;if(bgmEl)bgmEl.volume=BGM_VOLUME;},ms);
}
function updateBgmInd(){
  const el=document.getElementById("bgmInd");if(!el)return;
  el.textContent=bgmFailed?"🎵 BGMなし（sounds/bgm.mp3を置くと流れます）"
    :(bgmWanted?"🎵 BGM ON（Bで切替）":"🎵 BGM OFF（Bで切替）");
}

/* ---- 以下はフォールバック用の合成音（WebAudio・外部ファイル不要） ---- */
let audioCtx=null, muted=false;
function ac(){
  if(!audioCtx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)audioCtx=new AC();}
  if(audioCtx&&audioCtx.state==="suspended")audioCtx.resume();
  return audioCtx;
}
/* ドラムロール：低いタム音を加速しながら連打（durationSec の間） */
function playDrumroll(durationSec){
  if(muted)return null;const ctx=ac();if(!ctx)return null;
  const master=ctx.createGain();master.gain.value=1;master.connect(ctx.destination);
  let t=ctx.currentTime+0.03;const end=t+durationSec;let gap=0.15;
  while(t<end){
    const o=ctx.createOscillator(),g=ctx.createGain();
    const f=130+Math.random()*25;
    o.type="sine";o.frequency.setValueAtTime(f,t);
    o.frequency.exponentialRampToValueAtTime(f*0.55,t+0.07);
    g.gain.setValueAtTime(0.45,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.09);
    o.connect(g).connect(master);o.start(t);o.stop(t+0.1);
    t+=gap;gap=Math.max(0.04,gap*0.94);   // だんだん速く
  }
  return {stop(){try{master.gain.value=0;master.disconnect();}catch(e){}}};
}
/* 発表：シンバル＋タターン♪（2音） */
function playFanfare(){
  if(muted)return;const ctx=ac();if(!ctx)return;
  const t0=ctx.currentTime+0.02;
  /* シンバル（ホワイトノイズ） */
  const len=Math.floor(ctx.sampleRate*1.1);
  const buf=ctx.createBuffer(1,len,ctx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.4);
  const src=ctx.createBufferSource();src.buffer=buf;
  const hp=ctx.createBiquadFilter();hp.type="highpass";hp.frequency.value=4200;
  const ng=ctx.createGain();ng.gain.value=0.4;
  src.connect(hp).connect(ng).connect(ctx.destination);src.start(t0);
  /* タターン♪（ド→ソの2音） */
  [[523.25,0,0.16],[783.99,0.14,0.5]].forEach(([f,dt,dur])=>{
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type="triangle";o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t0+dt);
    g.gain.exponentialRampToValueAtTime(0.35,t0+dt+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,t0+dt+dur);
    o.connect(g).connect(ctx.destination);o.start(t0+dt);o.stop(t0+dt+dur+0.05);
  });
}
/* 拍手（applause.mp3が無いとき用：短いノイズを不規則に重ねてパチパチ感を出す） */
function playApplauseSynth(){
  if(muted)return;const ctx=ac();if(!ctx)return;
  const t0=ctx.currentTime+0.05;
  for(let i=0;i<36;i++){
    const t=t0+Math.random()*1.6;                    // 1.6秒の間に36回の「パチ」
    const len=Math.floor(ctx.sampleRate*0.03);
    const buf=ctx.createBuffer(1,len,ctx.sampleRate);
    const d=buf.getChannelData(0);
    for(let j=0;j<len;j++)d[j]=(Math.random()*2-1)*Math.pow(1-j/len,1.5);
    const src=ctx.createBufferSource();src.buffer=buf;
    const bp=ctx.createBiquadFilter();bp.type="bandpass";bp.frequency.value=1800+Math.random()*1800;
    const g=ctx.createGain();g.gain.value=0.10+Math.random()*0.12;
    src.connect(bp).connect(g).connect(ctx.destination);src.start(t);
  }
}

/* ============================================================
   紙吹雪（CSSパーティクル。数秒で自動削除）
   ============================================================ */
function confetti(n){
  const colors=["#F0662A","#E9505F","#F5B301","#2C9E6B","#3D7DD8","#9B6BD3","#2AA8A0","#E89A00"];
  const wrap=document.createElement("div");wrap.className="confetti";
  for(let i=0;i<(n||80);i++){
    const p=document.createElement("i");
    p.style.left=(Math.random()*100)+"vw";
    p.style.background=colors[i%colors.length];
    const sz=(6+Math.random()*9);

/* ============================================================
   データ取込（Dキー・幹事用）
   GASから view=awards / stats / teeball を取得し、DATAブロックを生成する。
   賞の計算は既存の表彰画面（orange_Award）と同一の1人1賞ロジック。
   ============================================================ */
const GAS_URL_DEFAULT="https://script.google.com/macros/s/AKfycbxGKwfIE-zp_1FUdBZrDb_ZQ3Fl12dmjDevVNfOEBRuPOTAl2vFtcullzjjXtONFi_Dqg/exec";

/* 1人1賞の優先順（既存 orange_Award の AWARD_DEFS と同一。変更しないこと） */
const IMPORT_AWARD_DEFS=[
  {name:"打率賞", cond:function(t,md){return t.daseki>=md;}, metric:function(t){return t.avg;}, fmt:function(v){return v.toFixed(3).replace(/^0/,'');}},
  {name:"安打賞", metric:function(t){return t.anda;}, fmt:function(v){return v+"本";}},
  {name:"打点賞", metric:function(t){return t.daten;}, fmt:function(v){return v+"点";}},
  {name:"得点賞", metric:function(t){return t.tokuten;}, fmt:function(v){return v+"点";}},
  {name:"出塁賞", metric:function(t){return t.shutsurui;}, fmt:function(v){return v+"回";}},
  {name:"オールラウンダー賞", metric:function(t){return t.posKinds;}, fmt:function(v){return v+"ポジション";}},
  {name:"守備好プレー賞", metric:function(t){return t.play;}, fmt:function(v){return v+"pt";}},
  {name:"カバーありがとう賞", metric:function(t){return t.sub;}, fmt:function(v){return v+"回";}},
  {name:"最多途中出場賞", metric:function(t){return t.sub;}, fmt:function(v){return v+"回";}},
  {name:"最多代打賞", metric:function(t){return t.daida;}, fmt:function(v){return v+"回";}},
  {name:"皆勤賞", metric:function(t,md,tg){return (tg>0 && t.games===tg)?1:0;}, fmt:function(v,tg){return tg+"試合";}}
];
/* スタンプ閾値（既存 orange_Award の STAMPS と同一） */
const IMPORT_STAMPS={
  batting:{metric:"anda", tiers:[{emoji:"🎉",n:1},{emoji:"⭐",n:5},{emoji:"🔥",n:10},{emoji:"👑",n:20}]},
  onbase: {metric:"shutsurui", tiers:[{emoji:"👟",n:1},{emoji:"🚀",n:10},{emoji:"🏰",n:20}]}
};

function isImportOpen(){return document.getElementById("importOverlay").classList.contains("open");}
function importToggle(){
  const ov=document.getElementById("importOverlay");
  if(ov.classList.contains("open")){ov.classList.remove("open");}
  else{
    if(!document.getElementById("impUrl").value)document.getElementById("impUrl").value=GAS_URL_DEFAULT;
    ov.classList.add("open");

}

/* 1人1賞の割り当て（既存 renderCeremony と同一の手順） */
function assignOnePerChild(totals,MIN_DASEKI,TOTAL_GAMES){
  const assigned={}, list=[];
  IMPORT_AWARD_DEFS.forEach(function(def){
    let best=null,bestVal=0;
    totals.forEach(function(t){
      if(assigned[t.child])return;
      if(def.cond && !def.cond(t,MIN_DASEKI,TOTAL_GAMES))return;
      const v=def.metric(t,MIN_DASEKI,TOTAL_GAMES);
      if(v>bestVal){bestVal=v;best=t;}
    });
    if(best){assigned[best.child]=true;
      list.push({name:def.name,child:best.child,value:def.fmt?def.fmt(bestVal,TOTAL_GAMES):String(bestVal),comment:""});}
  });
  return list;
}

/* 取得データ → DATAオブジェクトの生成 */
function genData(aw,stt,tb){
  const a=aw.awards||{};
  const roster=aw.roster||[];
  const totals=a.totals||[];
  const assignList=assignOnePerChild(totals,a.minDaseki||0,a.totalGames||0);
  const manual=(a.manual||[]).map(m=>({name:m.award,child:m.child,value:"",comment:m.comment||"",type:"manual"}));

  /* チーム数値（既存の年度成績タブのチームカードと同じ計算） */
  const games=(stt.games||[]).slice().sort((x,y)=>String(x.date)<String(y.date)?-1:String(x.date)>String(y.date)?1:0);
  let streak=0;for(let i=games.length-1;i>=0;i--){if(games[i].result==="〇")streak++;else break;}
  const recent=games.slice(-5).map(g=>g.result).join("");
  const teamHits=(tb.teeball||[]).reduce((s,r)=>s+(Number(r.anda)||0),0);

  /* 子ごとの通算（スタンプ判定用。既存スタンプタブと同じ合算） */
  const sums={};
  (tb.teeball||[]).forEach(r=>{
    const c=r.child;if(!c)return;
    if(!sums[c])sums[c]={daseki:0,anda:0,daten:0,tokuten:0,shutsurui:0,daida:0};
    ["daseki","anda","daten","tokuten","shutsurui","daida"].forEach(k=>sums[c][k]+=Number(r[k])||0);
  });

  /* 子→賞の対応（データ賞優先、なければ手動賞） */
  const awardBy={};
  assignList.forEach(x=>{awardBy[x.child]=x;});
  manual.forEach(x=>{if(!awardBy[x.child])awardBy[x.child]=x;});

  const children=roster.map(nm=>{
    const t=sums[nm]||{daseki:0,anda:0,daten:0,tokuten:0,shutsurui:0,daida:0};
    const stamps=[];
    Object.keys(IMPORT_STAMPS).forEach(k=>{
      const g=IMPORT_STAMPS[k];
      g.tiers.forEach(ti=>{if((t[g.metric]||0)>=ti.n)stamps.push(ti.emoji);});
    });
    const w=awardBy[nm];
    return {name:nm,
      award:w?{name:w.name,value:w.value,comment:w.comment||""}:{name:"",value:"",comment:""},
      stamps:stamps, totals:t};
  });
  const noAward=roster.filter(nm=>!awardBy[nm]);

  const data={
    title:DATA.title, subtitle:DATA.subtitle,   // タイトル・しめの文言は現在の値を引き継ぐ
    team:{win:stt.win||0, lose:stt.lose||0, draw:stt.draw||0, gf:stt.gf||0, ga:stt.ga||0,
      teamHits:teamHits, totalGames:games.length, streak:streak, recent:recent},
    awards:assignList.concat(manual),
    posAwards:(a.posAwards||[]).map(p=>({position:p.position,winners:p.winners||[],value:p.value||""})),
    firsts:(a.firsts||[]).map(f=>({child:f.child,firstHit:f.firstHit||"",firstRbi:f.firstRbi||"",firstReach:f.firstReach||"",firstRun:f.firstRun||""})),
    children:children,
    closing:DATA.closing
  };
  const summary="データ賞 "+assignList.length+"件（1人1賞）／ 手動賞 "+manual.length+"件 ／ ポジションMVP "+(a.posAwards||[]).length+"件 ／ 名簿 "+roster.length+"人 ／ 対象試合 "+(a.totalGames||0)+"試合"
    +(noAward.length
      ?"\n⚠ まだ賞のない子："+noAward.join("、")+"\n（集計システムで手動賞を入れてから取り込み直すのがおすすめ。DATAのawardsとchildrenに直接書き足してもOK）"
      :"\n🎊 全員に賞が行き渡っています")
    +"\n\n📷 顔写真のファイル名対応（photos/ フォルダに置く）：\n"
    +roster.map((nm,i)=>String(i+1).padStart(2,"0")+".jpg＝"+nm).join("　");
  return {data:data, summary:summary};
}

async function runImport(){
  const url=(document.getElementById("impUrl").value||"").trim();
  const year=(document.getElementById("impYear").value||"").trim();
  const st=document.getElementById("impStatus");
  const btn=document.getElementById("impRun");
  if(!url){st.textContent="GASのURLを入れてください。";return;}
  btn.disabled=true;st.textContent="取得中…（10秒ほどかかることがあります）";
  document.getElementById("impOut").value="";document.getElementById("impCopy").disabled=true;
  try{
    const q=year?("&year="+encodeURIComponent(year)):"";
    /* fresh=1 でサーバーキャッシュも飛ばして確定データを取得 */
    const [aw,stt,tb]=await Promise.all([
      fetch(url+"?view=awards&kind=all&bunrui=all&fresh=1"+q).then(r=>r.json()),
      fetch(url+"?view=stats&fresh=1"+q).then(r=>r.json()),
      fetch(url+"?view=teeball&fresh=1"+q).then(r=>r.json())
    ]);
    if(!aw||!aw.awards)throw new Error("awardsが取得できません（URL・GASのデプロイを確認してください）");
    const g=genData(aw,stt,tb);
    const text="/* ==== DATA START ==== */\nconst DATA = "+JSON.stringify(g.data,null,2)+";\n/* ==== DATA END ==== */";
    document.getElementById("impOut").value=text;
    document.getElementById("impCopy").disabled=false;
    st.textContent="✅ 生成できました（年度 "+(year||aw.currentYear||"?")+"）\n"+g.summary
      +"\n\n① 下のテキストをコピー\n② presentation_1b_sticker.html をメモ帳等で開く\n③ /* ==== DATA START ==== */ 〜 /* ==== DATA END ==== */ を丸ごと貼り替えて保存";
  }catch(e){
    st.textContent="❌ 失敗："+(e&&e.message?e.message:e)+"\n（ネット接続と、GASのURL（/execまで）を確認してください）";
  }
  btn.disabled=false;
}

function copyImport(){
  const ta=document.getElementById("impOut");
  ta.select();ta.setSelectionRange(0,ta.value.length);
  let ok=false;
  try{ok=document.execCommand("copy");}catch(e){}
  if(!ok&&navigator.clipboard){navigator.clipboard.writeText(ta.value).then(()=>{},()=>{});ok=true;}
  document.getElementById("impStatus").textContent=(ok?"📋 コピーしました。":"コピーできませんでした。テキストを手で選択してコピーしてください。")
    +" presentation_1b_sticker.html の DATA START〜END を貼り替えて保存してください。";
}

document.getElementById("impRun").onclick=runImport;
document.getElementById("impClose").onclick=importToggle;
document.getElementById("impCopy").onclick=copyImport;

/* ============================================================
   操作
   進む＝クリック/→/Space/Enter/PageDown、戻る＝←/PageUp
   賞スライド：賞名 →（進む）ドラムロール2.2秒 → 発表＋紙吹雪。
   ・ドラムロール中に進む＝すぐ発表にスキップ。
   ・戻る＝発表を巻き戻して賞名だけに（言い直し用）。
   ============================================================ */
const ROLL_MS=2200;
function cancelRoll(){
  if(rollTimer){clearTimeout(rollTimer);rollTimer=null;}
  stopSound("drumroll");                      // MP3のドラムロールを停止
  if(rollSound){rollSound.stop();rollSound=null;}   // 合成音のドラムロールを停止
  bgmDuck(false);                             // 下げていたBGM音量を戻す
}
function doReveal(i){
  cancelRoll();
  state[i]=2;
  bgmDuck(true);                              // 発表の効果音を聞かせるためBGMを下げる
  if(!playSound("fanfare"))playFanfare();     // 名前登場：MP3がなければ合成音
  if(!playSound("applause"))playApplauseSynth(); // 拍手：MP3がなければ合成音
  bgmDuckRestoreLater(2500);                  // 拍手が落ち着いたらBGMを戻す（連打時は自動キャンセル）
  render();
  confetti(80);
}
function forward(){
  bgmStart();                                 // 最初の操作でBGM開始（自動再生制限対応）
  const sl=SLIDES[idx];
  /* ver005：チームのきせきはクリックごとにカードを1枚ずつ発表。全部出たら次のスライドへ */
  if(sl.type==="team"&&state[idx]<teamSteps()){
    state[idx]++;render();
    /* ver007：最後のステップ＝「みんなすごい！」で紙吹雪＋歓声（無ければ合成拍手） */
    if(state[idx]===teamSteps()){
      bgmDuck(true);
      if(!playSound("cheer"))playApplauseSynth();
      bgmDuckRestoreLater(3000);
      confetti(90);
    }
    return;
  }
  if(hasReveal(sl)){
    if(state[idx]===0){                       // 賞名 → ドラムロール開始
      state[idx]=1;render();
      bgmDuck(true);                          // ドラムロール中はBGMを下げる
      if(!playSound("drumroll"))rollSound=playDrumroll(ROLL_MS/1000);  // MP3がなければ合成音
      const cur=idx;
      rollTimer=setTimeout(()=>{rollTimer=null;doReveal(cur);},ROLL_MS);
      return;
    }
    if(state[idx]===1){doReveal(idx);return;} // ロール中 → すぐ発表
  }
  if(idx<SLIDES.length-1){idx++;render();}
}
function back(){
  bgmStart();
  const sl=SLIDES[idx];
  /* ver005：チームのきせきは1枚ずつ巻き戻す（言い直し用） */
  if(sl.type==="team"&&state[idx]>0){state[idx]--;render();return;}
  if(hasReveal(sl)&&state[idx]>0){cancelRoll();state[idx]=0;render();return;}
  if(idx>0){cancelRoll();idx--;render();}
}
function jump(to){cancelRoll();idx=to;render();}

document.addEventListener("click",e=>{
  if(isImportOpen())return;                    // 取込画面を開いている間はスライドを進めない
  forward();
});
document.addEventListener("keydown",e=>{
  const tag=e.target&&e.target.tagName;
  if(tag==="INPUT"||tag==="TEXTAREA")return;   // 取込画面の入力中はスライド操作しない
  if(e.key==="d"||e.key==="D"){importToggle();return;}   // データ取込（幹事用）の開閉
  if(isImportOpen()){if(e.key==="Escape")importToggle();return;}
  if(e.key==="ArrowRight"||e.key===" "||e.key==="Enter"||e.key==="PageDown"){e.preventDefault();forward();}
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();back();}
  else if(e.key==="Home"){jump(0);}
  else if(e.key==="End"){jump(SLIDES.length-1);}
  else if(e.key==="f"||e.key==="F"){
    if(document.fullscreenElement)document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  }
  else if(e.key==="m"||e.key==="M"){
    muted=!muted;
    if(muted){                                 // 消音にしたら鳴っている音を止める（演出は続く）
      stopAllSounds();
      if(rollSound){rollSound.stop();rollSound=null;}
      bgmPause();                              // BGMも止める
    }else{
      bgmResume();                             // 音ONに戻したらBGMも再開
    }
    document.getElementById("soundInd").textContent=muted?"🔇 音OFF（Mで切替）":"🔊 音ON（Mで切替）";
  }
  else if(e.key==="b"||e.key==="B"){bgmToggle();}   // BGMだけのON/OFF
});

render();
</script>
